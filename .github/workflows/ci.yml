# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
      - ver.0.2.0
      - codex/**
  pull_request:
    branches:
      - main
      - ver.0.2.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build distribution
        run: pnpm build

      - name: Verify external consumer
        run: pnpm verify:external
