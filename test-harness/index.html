<!-- test-harness/index.html -->
<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>RELink Web Runtime Test Harness</title></head>
  <body>
    <main>
      <h1>RELink Web Runtime Test Harness</h1>
      <p>Runtime 固有の手動評価 UI。Testbed は Runtime 非依存の決定的な検証環境です。</p>
      <form id="connection"><label>Testbed Origin <input id="origin" type="url" value="http://127.0.0.1:3100" required /></label><button>Connect</button></form>
      <p id="connection-state" role="status"></p><pre id="info"></pre>
      <section><h2>Case selection</h2><select id="cases" disabled><option>接続してケースを取得してください</option></select><pre id="case"></pre></section>
      <section><h2>Runtime document</h2><button id="load" disabled>Load AR-XML</button><pre id="document"></pre></section>
      <section><h2>Capability invocation</h2><label>Inputs JSON<textarea id="inputs" rows="8" disabled>{}</textarea></label><button id="invoke" disabled>Invoke</button></section>
      <section><h2>Results</h2><h3>Runtime Result</h3><pre id="result"></pre><h3>Runtime Error</h3><pre id="runtime-error"></pre><h3>Expected Result / Request</h3><pre id="expected"></pre><h3>Observed Request</h3><pre id="observed"></pre><h3>Request comparison</h3><pre id="comparison"></pre></section>
      <button id="reset" disabled>Reset Testbed observations</button><p id="error" role="alert"></p>
    </main><script type="module" src="./main.ts"></script>
  </body>
</html>
